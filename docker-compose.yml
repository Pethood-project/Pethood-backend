services:
  db:
    image: docker.io/postgres:16-alpine
    container_name: pethood-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pethood
      POSTGRES_PASSWORD: pethood
      POSTGRES_DB: pethood
    ports:
      - '5432:5432'
    volumes:
      - pethood_pgdata:/var/lib/postgresql/data

  redis:
    image: docker.io/redis:7-alpine
    container_name: pethood-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - pethood_redisdata:/data

volumes:
  pethood_pgdata:
  pethood_redisdata:
