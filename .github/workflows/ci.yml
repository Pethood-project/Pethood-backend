name: CI

on:
  push:
    branches: '*'
  pull_request:
    branches: [dev, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Preparar .env
        # CI no tiene .env (gitignoreado). Se deriva de .env.example, la misma plantilla
        # que usa cualquiera que clona el repo — nada de secretos hardcodeados en el workflow.
        run: cp .env.example .env

      - name: Generar Prisma Client
        run: npx prisma generate

      - name: Formato (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build
        run: npm run build

      - name: Tests
        run: npm run test
